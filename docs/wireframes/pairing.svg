ne="alphabetic">◉</text></g></g><g clip-path="url(#frame-1)"><g transform="translate(34 158.5) rotate(0 146.3 17.5)"><text x="0" y="25.060546875" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Connect to Briareus</text></g></g><g clip-path="url(#frame-1)"><g stroke-linecap="round" transform="translate(34 213.5) rotate(0 676 48)"><path d="M24 0 C396.36 7.37, 767.71 6.11, 1328 0 C1341.6 1.66, 1355.34 8.82, 1352 24 C1354.05 39.35, 1353.03 48.18, 1352 72 C1352.68 84.89, 1346.55 99.19, 1328 96 C1022.83 98.42, 719.19 98.91, 24 96 C7.64 96.18, -3.09 87.06, 0 72 C-2.77 58.3, -2.6 42.91, 0 24 C2.01 5.21, 11.14 0.73, 24 0" stroke="none" stroke-width="0" fill="#e9ecef"></path><path d="M24 0 C516.65 -0.54, 1009.57 -1.04, 1328 0 M24 0 C538.97 -4.51, 1054.15 -4.31, 1328 0 M1328 0 C1344.17 1.56, 1352.25 8.86, 1352 24 M1328 0 C1345.62 0.56, 1352.18 7.41, 1352 24 M1352 24 C1353.87 32.97, 1351.19 43.64, 1352 72 M1352 24 C1353.16 39.89, 1352.47 54.19, 1352 72 M1352 72 C1353.1 89.49, 1342.54 95.29, 1328 96 M1352 72 C1351.99 86.72, 1344.66 93.91, 1328 96 M1328 96 C870.05 94.85, 410.67 94.92, 24 96 M1328 96 C1059.09 91.92, 791.18 92.09, 24 96 M24 96 C6.05 97.86, 1.31 87.81, 0 72 M24 96 C9.3 94.33, -0.66 89.9, 0 72 M0 72 C-0.06 60.96, 0.32 51.13, 0 24 M0 72 C0.87 56.99, -0.08 42.22, 0 24 M0 24 C0.01 9.28, 7.66 -1.4, 24 0 M0 24 C-2.17 5.91, 5.98 -2.18, 24 0" stroke="#1e1e1e" stroke-width="1" fill="none"></path></g></g><g clip-path="url(#frame-1)"><g transform="translate(46 221.5) rotate(0 169.4 20.625)"><text x="0" y="9.84521484375" font-family="Helvetica, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">🌐  https://briareus.example.com</text><text x="0" y="23.59521484375" font-family="Helvetica, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">────────────────────────────</text><text x="0" y="37.34521484375" font-family="Helvetica, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">🔑  Token</text></g></g><g clip-path="url(#frame-1)"><g transform="translate(34 319.5) rotate(0 353.1 7.5)"><text x="0" y="10.740234375" font-family="Helvetica, Segoe UI Emoji" font-size="12px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Create a token on the web dashboard under Settings → Devices and clients, with Manage or Read-only access.</text></g></g><g clip-path="url(#frame-1)"><g stroke-linecap="round" transform="translate(34 358.5) rotate(0 33.5 13)"><path d="M6.5 0 C21.23 -1.81, 38.21 -0.61, 60.5 0 M6.5 0 C26.14 0.34, 45.2 -0.45, 60.5 0 M60.5 0 C66.31 -0.3, 65.39 3.14, 67 6.5 M60.5 0 C65.12 1.35, 64.99 0.77, 67 6.5 M67 6.5 C66.54 9.11, 66.88 12.71, 67 19.5 M67 6.5 C66.46 11.1, 66.79 16.78, 67 19.5 M67 19.5 C65.96 22.61, 65.29 27.67, 60.5 26 M67 19.5 C69.29 22.24, 63.6 26.79, 60.5 26 M60.5 26 C44.32 26.43, 31.66 27.55, 6.5 26 M60.5 26 C48.01 25.46, 33.32 26.54, 6.5 26 M6.5 26 C0.25 24.58, 0.09 24.73, 0 19.5 M6.5 26 C2.87 27.46, -1.51 23.66, 0 19.5 M0 19.5 C-1.08 14.02, -1.2 10.57, 0 6.5 M0 19.5 C-0.6 15.1, 0.24 10.04, 0 6.5 M0 6.5 C-1.99 3.02, 0.42 1.36, 6.5 0 M0 6.5 C1.58 0.21, 4 1.57, 6.5 0" stroke="#1e1e1e" stroke-width="1" fill="none"></path></g></g><g clip-path="url(#frame-1)"><g transform="translate(43 364) rotate(0 23.1 7.5)"><text x="0" y="10.740234375" font-family="Helvetica, Segoe UI Emoji" font-size="12px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Connect</text></g></g><g clip-path="url(#frame-1)"><g stroke-linecap="round" transform="translate(34 408.5) rotate(0 676 22)"><path d="M11 0 C484.76 3.4, 958.25 4, 1341 0 M1341 0 C1350.14 -1.76, 1353.24 2.72, 1352 11 M1352 11 C1350.14 17.77, 1350.29 22, 1352 33 M1352 33 C1352.82 39.3, 1346.65 44.98, 1341 44 M1341 44 C1065.49 46.76, 788.79 45.87, 11 44 M11 44 C2.66 43.78, -0.52 42.12, 0 33 M0 33 C0.3 28.26, -0.82 22.15, 0 11 M0 11 C1.99 3.44, 2.82 -1.64, 11 0" stroke="#1e1e1e" stroke-width="1.5" fill="none" stroke-dasharray="8 9"></path></g></g><g clip-path="url(#frame-1)"><g transform="translate(46 416.5) rotate(0 190.57500000000002 6.875)"><text x="0" y="9.84521484375" font-family="Helvetica, Segoe UI Emoji" font-size="11px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The server rejected this token. Create a new one and try again.</text></g></g><g transform="translate(10 980.5) rotate(0 69.30000000000001 11.25)"><text x="0" y="16.1103515625" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Platform notes</text></g><g transform="translate(10 1010.5) rotate(0 897.0500000000001 61.25)"><text x="0" y="12.5302734375" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Reference: briareus-windows. Other clients match this structure, differing only as noted here.</text><text x="0" y="30.0302734375" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A single 520px column, centred, with no sidebar or header. The logo is a 52px rounded tile in accent tint.</text><text x="0" y="47.5302734375" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The card holds two edit rows separated by a rule: server URL (globe glyph, cue 'https://briareus.example.com') and Token (key glyph, password-masked, cue 'Token').</text><text x="0" y="65.0302734375" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Enter in the server field moves to Token, and Enter in Token connects. Connect is the prominent full-width button and reads 'Connecting…' while it works. A connection error appears as a notice box under it; the error text drawn here</text><text x="0" y="82.5302734375" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">is a sample.</text><text x="0" y="100.0302734375" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The token is stored in Windows Credential Manager. At pairing the app reads GET /api/v1/openapi.json to decide which controls to show.</text><text x="0" y="117.5302734375" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Region names (sidebar, canvas, raise, sunken) are the theme.* roles; widths and margins are layout.* in tokens/. Greys only, on purpose.</text></g></svg>
